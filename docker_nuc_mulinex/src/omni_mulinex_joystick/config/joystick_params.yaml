omni_mulinex_joystick:
  ros__parameters:
    timer_period_ms: 100
    sup_vel_x: 0.5
    sup_vel_y: 0.5
    sup_omega: 0.5
    height_step: 0.005
    roll_step: 0.02
    pitch_step: 0.02
    yaw_step: 0.02
    pos_step: 0.005
    max_height: 0.15
    max_roll: 0.3
    max_pitch: 0.3
    max_yaw: 0.15
    max_pos_x: 0.05
    max_pos_y: 0.05
    deadzone: 0.1
    subscribe_state: true

    demo:
      area_width:     0.5
      area_depth:     0.5
      travel_time:    1.3
      pose_time:      2.0
      yaw_angle:      1.5708
      pitch_angle:    0.2
      roll_angle:     0.2
      base_x:         0.2
      base_z:         0.05

    # START → figure-eight (lemniscate of Gerono, open loop). Sticks or ✕/△/L1/R1 interrupt it.
    figure_eight:
      size:        1.0    # [m] half-length of the eight (overall 2·size × size)
      max_lin_vel: 0.2    # [m/s] peak linear speed
      max_ang_vel: 0.5    # [rad/s] peak yaw rate (differential mode)
      laps:        1      # number of eights
      ramp_time:   3.0    # [s] smooth speed ramp at start and end
      holonomic:   false  # false = vx + wz (traquad, differential); true = vx/vy, fixed heading

    # ○ → identification mission (open loop, tracks and hips commanded directly, wheel mode
    # direct during the mission). Sticks or any other button stop it: tracks to zero, hips held,
    # back to the twist mode. The parameters are read at every ○, e.g.
    #   ros2 param set /omni_mulinex_joystick identification.mission t2
    #   ros2 param set /omni_mulinex_joystick identification.alphas "[1.3, 1.6]"   (first try: narrow range)
    # t1/t2/t3: robot standing at q_stand (△ first), Qualisys on.
    identification:
      mission:          "t1,t2,t3"   # t1 (turns in place), t2 (arcs), t3 (validation), or a list in a row
      pause:            20.0   # [s] stop at the stand pose between missions in a row
      stand:            1.6    # [rad] shoulder angle of q_stand (traquad8_dji.yaml)
      alphas:           [1.05, 1.3, 1.6, 1.85]  # [rad] shoulder angles of t1 / t2
      sprocket_radius:  0.028  # [m] wheel_rad of the SBC
      assist_gain:      10.0   # transition_wheels.gain of the SBC: track += -k·q̇_HFE
      sync_speed:       0.168  # [m/s] belt speed of the sync turns (6 rad/s; Qualisys clock alignment)
      stance_tolerance: 0.1    # [rad] shoulders must be within this of stand to start t1-t3
      period_ms:        10     # command period [ms]
      speed_ramp:       0.5    # [s] track speed changes as cosine ramps
      max_track_speed:  9.0    # [rad/s] a mission above this is refused (drives: max_velocity 10)
      alpha_min:        1.0    # [rad] shoulder range of the missions (tracks flat, ankles off
      alpha_max:        1.9    #       their stops); a mission outside it is refused
      record_bag:       true   # ○ also records a bag of the mission: <bag_dir>/<mission>_<date>_<time>
      bag_dir:          "~/mulinex_ws/bags/ident"   # in the container (host: docker_nuc_mulinex/bags/ident)
      record_delay:     3.0    # [s] the bag subscribes first, robot still; then the mission starts
      bag_topics:       ["/omni_controller/joints_state", "/omni_controller/debug/joints_command",
                         "/imu_sensor/imu", "/omni_mulinex_joystick/identification/segment",
                         "/omni_controller/joints_reference", "/omni_controller/direct_wheels_cmd",
                         "/omni_controller/safety_state", "/omni_controller/distributors_state"]
